<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>리듬 챌린지</title>
<style>
:root{
  --bg:#080a0f;
  --panel:#11151d;
  --panel2:#0c1017;
  --line:#252c38;
  --line2:#343d4b;
  --text:#f4f6fa;
  --muted:#8791a2;
  --soft:#b6bfcc;
  --good:#62d88a;
  --bad:#ff746d;
  --accent:#f5f7fb;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:0 14px}
button,select{font:inherit}
button{cursor:pointer}
#app{width:min(900px,100%);margin:0 auto;padding:30px 0 46px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:16px}
h1{margin:0;font-size:clamp(30px,5vw,44px);line-height:1;font-weight:950;letter-spacing:-.04em}
.desc{margin-top:8px;color:var(--muted);font-size:13px}
.pill{padding:7px 12px;border:1px solid var(--line2);border-radius:999px;background:#0e1219;color:var(--soft);font-size:12px;font-weight:900;letter-spacing:.04em;white-space:nowrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 34px rgba(0,0,0,.18)}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel2);border:1px solid #1c232e;border-radius:12px;padding:9px 11px;min-width:0}
.stat span{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em}
.stat b{display:block;margin-top:2px;font-size:21px;line-height:1.15}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;aspect-ratio:2/1}
.cell{position:relative;min-width:0;min-height:96px;background:#0b0f15;border:1px solid var(--line2);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .08s,border-color .08s,transform .08s}
.num{position:absolute;top:7px;left:9px;color:#626d7d;font-size:10px;font-weight:800}
.note{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:38px;font-weight:900;line-height:1;color:var(--text)}
.cell.current{background:#202631;border-color:#eef1f6;transform:scale(1.018)}
.cell.hit{background:#12271b;border-color:var(--good)}
.cell.miss{background:#2a1515;border-color:var(--bad)}
.cell.dim{opacity:.38}

.message{text-align:center;font-size:26px;font-weight:950;line-height:1.1;min-height:30px;margin-top:17px;letter-spacing:-.02em}
.detail{text-align:center;color:var(--muted);font-size:12px;min-height:19px;margin-top:5px}

#tap{min-height:148px;margin-top:14px;border:1px solid #303947;border-radius:18px;background:#0d1219;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:clamp(22px,4vw,31px);font-weight:950;letter-spacing:.03em;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .05s,background .08s,border-color .08s}
#tap:active{transform:scale(.992);background:#141a23;border-color:#596474}

.buttons{display:flex;justify-content:center;gap:8px;margin-top:12px}
.buttons button{min-width:104px;padding:10px 17px;border:0;border-radius:10px;background:var(--accent);color:#11151a;font-weight:900}
.buttons button.secondary{background:#242b36;color:var(--text)}
button:disabled{opacity:.4;cursor:default}

.progress{height:5px;background:#242a34;border-radius:99px;overflow:hidden;margin-top:13px}
.progress i{display:block;height:100%;width:0;background:#eef1f5;border-radius:99px}


.eighth-pair-text{display:inline-flex;align-items:center;justify-content:center;gap:.10em;line-height:1;white-space:nowrap;font-size:1em}
.eighth-pair-text span{display:inline-block;font-size:1em}
.sixteenth-pair-text{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:1.45em;
  line-height:1;
  white-space:nowrap;
}
.sixteenth-pair-text svg{
  width:3.55em;
  height:1.42em;
  overflow:visible;
  display:block;
}
 .p1-text{display:inline-flex;width:100%;height:1.45em;align-items:center;justify-content:center;gap:.02em}
.p1-text svg{height:1.42em;width:auto;overflow:visible;display:block;flex:none}
.p1-text .rest8-svg{height:1.00em;width:auto;overflow:visible;display:block;flex:none;margin-left:-1.12em}
.quarter-rest-wrap{display:inline-flex;align-items:center;justify-content:center;width:100%;height:1.45em}
.quarter-rest-wrap .rest4-svg{height:1.15em;width:auto;overflow:visible;display:block}

@media(max-width:620px){
  body{padding:0 10px}
  #app{padding-top:18px}
  header{align-items:flex-start;flex-direction:column;gap:10px}
  .pill{align-self:flex-start}
  .card{padding:13px;border-radius:18px}
  .hud{grid-template-columns:1fr 1fr}
  .board{gap:6px}
  .cell{min-height:92px;border-radius:12px}
  .note{font-size:34px}
  .message{font-size:23px;margin-top:14px}
  #tap{min-height:180px;border-radius:18px}
}
@media(max-width:390px){
  .cell{min-height:82px}
  .note{font-size:30px}
  #tap{min-height:160px}
}

.message.perfect{color:#ffffff;font-size:28px}
.message.good{color:#e8ebf0;font-size:26px}
.message.miss{color:#ff756d;font-size:28px}


/* Compact mobile HUD + fullscreen */
.brand{min-width:0}
.header-actions{display:flex;align-items:center;gap:6px}
.icon-btn{
  width:34px;height:34px;padding:0;border:1px solid #303846;border-radius:9px;
  background:#11161e;color:#dce2eb;display:flex;align-items:center;
  justify-content:center;font-size:19px;line-height:1;
}
.icon-btn:active{transform:scale(.96)}
.compact-hud{grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.compact-hud .stat{padding:6px 8px;border-radius:9px}
.compact-hud .stat span{font-size:9px;letter-spacing:.07em}
.compact-hud .stat b{font-size:16px;line-height:1.1}
@media(max-width:620px){
  body{padding:0 9px}
  #app{padding-top:9px;padding-bottom:14px}
  header{margin-bottom:8px}
  h1{font-size:24px}
  .desc{display:none}
  .pill{padding:5px 8px;font-size:10px}
  .card{padding:9px;border-radius:15px}
  .compact-hud{gap:5px;margin-bottom:7px}
  .compact-hud .stat{padding:5px 6px}
  .compact-hud .stat b{font-size:15px}
  .message{font-size:20px;min-height:24px;margin-top:9px}
  .detail{font-size:11px;min-height:17px}
  #tap{min-height:0;height:29vh;max-height:none;margin-top:9px;border-radius:14px;font-size:21px}
  .buttons{margin-top:8px}
  .buttons button{min-width:88px;padding:8px 12px;font-size:13px}
  .progress{margin-top:8px;height:4px}
}
@media(max-width:390px){
  .compact-hud .stat b{font-size:14px}
  .cell{min-height:76px}
  .note{font-size:28px}
  #tap{height:26vh}
}
:fullscreen{background:var(--bg)}
:fullscreen #app{width:min(960px,96vw);max-width:960px;padding-top:10px}
:fullscreen #tap{height:28vh;max-height:none}


/* Mobile portrait play polish */
:root{
  --bg:#07090d;
  --panel:#10141b;
  --panel2:#0a0d12;
  --line:#202733;
  --line2:#2d3542;
  --text:#f7f8fb;
  --muted:#8c96a6;
  --accent:#f4f7fb;
}
html{height:100%;overflow-x:hidden}
body{
  min-height:100%;
  min-height:100dvh;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  background:radial-gradient(circle at 50% -12%,#1a2130 0,#07090d 46%);
  overscroll-behavior:none;
}
#app{
  width:min(460px,100%);
  min-height:calc(100dvh - max(8px,env(safe-area-inset-top)) - max(10px,env(safe-area-inset-bottom)));
  padding:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
header{
  align-items:center;
  flex-direction:row;
  gap:10px;
  margin:0 0 8px;
}
h1{font-size:22px;letter-spacing:0;line-height:1.05}
.brand{display:flex;align-items:center;min-height:34px}
.desc{display:none}
.header-actions{margin-left:auto}
.icon-btn{width:36px;height:36px;border-radius:8px;background:#151a23}
.pill{padding:6px 9px;border-radius:8px;font-size:10px;background:#151a23;color:#c5cedb}
.card{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:10px;
  border-radius:16px;
  background:linear-gradient(180deg,#121720,#0d1118);
  box-shadow:0 18px 44px rgba(0,0,0,.36);
}
.hud.compact-hud{gap:6px;margin:0;grid-template-columns:repeat(3,1fr)}
.compact-hud .stat{
  padding:7px 8px;
  border-radius:10px;
  background:#090c11;
  border-color:#1e2530;
}
.compact-hud .stat span{font-size:9px;letter-spacing:.05em;color:#7f8998}
.compact-hud .stat b{font-size:18px;line-height:1.05;margin-top:3px}
.board{
  gap:6px;
  aspect-ratio:1.55/1;
  min-height:0;
}
.cell{
  min-height:64px;
  border-radius:12px;
  background:#090d13;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.num{top:6px;left:7px;font-size:9px;color:#596475}
.note{font-size:clamp(25px,8.3vw,36px)}
.cell.current{
  background:#252d3b;
  border-color:#f7f9fc;
  box-shadow:0 0 0 2px rgba(247,249,252,.08),0 8px 20px rgba(0,0,0,.26);
}
.message{
  order:4;
  min-height:25px;
  margin:2px 0 0;
  font-size:21px;
  letter-spacing:0;
}
.detail{order:5;min-height:16px;margin:0;font-size:11px;color:#8f98a7}
#tap{
  order:6;
  height:clamp(190px,35dvh,280px);
  min-height:190px;
  margin:0;
  border-radius:16px;
  border-color:#343e4d;
  background:linear-gradient(180deg,#161c26,#0b0f15);
  color:#fbfcff;
  font-size:clamp(23px,6vw,30px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 24px rgba(0,0,0,.26);
}
#tap:active{transform:scale(.985);background:#202836;border-color:#6f7d90}
.buttons{order:7;margin:0;gap:8px}
.buttons button{min-width:0;flex:1;min-height:43px;border-radius:11px;padding:10px 12px;font-size:14px}
.progress{order:3;margin:0;height:5px;background:#1b222d}
.big{font-size:52px}
@media(max-height:720px) and (orientation:portrait){
  #app{justify-content:flex-start}
  #tap{height:30dvh;min-height:158px}
  .board{aspect-ratio:1.75/1}
  .cell{min-height:54px}
  .note{font-size:clamp(23px,7.4vw,32px)}
}
@media(max-width:390px){
  body{padding-left:8px;padding-right:8px}
  .card{padding:8px;gap:7px}
  h1{font-size:20px}
  .icon-btn{width:34px;height:34px}
  .pill{font-size:9px;padding:6px 7px}
  .compact-hud .stat{padding:6px}
  .compact-hud .stat b{font-size:16px}
  #tap{height:32dvh;min-height:168px}
  .buttons button{min-height:40px}
}
:fullscreen #app{width:min(460px,96vw);justify-content:center}
:fullscreen #tap{height:clamp(190px,35dvh,280px)}

/* Keep the portrait play screen focused on the game itself. */
@media(max-width:620px), (orientation:portrait){
  .card{gap:9px}
  .message{margin-top:1px}
}

/* Start screen */
.start-screen{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:radial-gradient(circle at 50% 35%,#1d2635 0,#090c12 62%);
  transition:opacity .22s ease,visibility .22s ease;
}
.start-screen.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.start-panel{
  width:min(430px,92vw);
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}
.start-title{
  font-size:clamp(34px,10vw,58px);
  font-weight:950;
  letter-spacing:-.04em;
  line-height:1;
}
.start-subtitle{
  color:#a7b0bf;
  font-size:15px;
  line-height:1.4;
  margin-bottom:10px;
}
.start-main{
  width:min(300px,78vw);
  height:clamp(88px,17vw,125px);
  border:0;
  border-radius:26px;
  background:#f5f7fb;
  color:#11151a;
  font-size:clamp(30px,8vw,48px);
  font-weight:950;
  letter-spacing:.04em;
  box-shadow:0 18px 40px rgba(0,0,0,.28);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.start-main:active{transform:scale(.975)}
@media(max-width:620px){
  .start-screen{padding:18px}
  .start-panel{gap:10px}
  .start-title{font-size:42px}
  .start-subtitle{font-size:14px}
  .start-main{width:82vw;height:112px;border-radius:24px}
}
:fullscreen .start-screen{background:radial-gradient(circle at 50% 35%,#1d2635 0,#090c12 62%)}


.judge-flash{
  position:fixed;
  left:50%;
  top:50%;
  z-index:12000;
  transform:translate(-50%,-50%) scale(.82);
  opacity:0;
  pointer-events:none;
  font-size:clamp(44px,12vw,84px);
  font-weight:1000;
  letter-spacing:.025em;
  line-height:1;
  text-shadow:0 4px 24px rgba(0,0,0,.55);
  white-space:nowrap;
}
.judge-flash.show{animation:judgePop .48s cubic-bezier(.15,.78,.18,1) both}
.judge-flash.perfect{color:#ffffff}
.judge-flash.good{color:#d5dbe4}
.judge-flash.miss{color:#ff6961}
.judge-flash.sync-tap{color:#ffffff;font-size:clamp(52px,14vw,96px)}
.judge-flash.countdown{
  color:#ffffff;
  font-size:clamp(76px,22vw,156px);
  letter-spacing:-.06em;
  text-shadow:0 6px 30px rgba(0,0,0,.62);
}
@keyframes judgePop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.72)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  65%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}
}


.result-screen{opacity:0;visibility:hidden;pointer-events:none}
.result-screen.show{opacity:1;visibility:visible;pointer-events:auto}
.result-panel{width:min(520px,94vw);gap:7px}
.result-total-label{margin-top:3px;color:#99a3b1;font-size:10px;font-weight:900;letter-spacing:.14em}
.result-total{font-size:clamp(58px,15vw,88px);font-weight:1000;line-height:.92;letter-spacing:-.05em}
.result-max-label{color:#758090;font-size:11px;margin-bottom:4px}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);width:min(430px,90vw);gap:6px;margin:3px 0 5px}
.result-stat{background:#0d1219;border:1px solid #28303b;border-radius:9px;padding:8px 5px 7px}
.result-stat span{display:block;color:#7f8998;font-size:9px;font-weight:800;letter-spacing:.05em}
.result-stat b{display:block;margin-top:3px;font-size:15px}
.result-stat small{display:block;margin-top:4px;color:#aeb6c2;font-size:9px;font-weight:700;line-height:1.35;white-space:nowrap}
.round-results{width:min(450px,91vw);display:flex;flex-direction:column;gap:5px;margin:2px 0 9px;max-height:36vh;overflow:auto;-webkit-overflow-scrolling:touch}
.round-row{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:6px;padding:6px 7px;border:1px solid #28303b;border-radius:8px;background:#0d1219}
.round-name{color:#929cab;font-size:10px;font-weight:900;text-align:left}
.block-scores{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.block-score{padding:4px 1px;border-radius:4px;background:#171d26;color:#e8ebf0;font-size:9px;font-weight:900;text-align:center}
.round-total{font-size:10px;font-weight:950;min-width:48px;text-align:right}
.main-btn{margin-top:1px}
.sync-screen{opacity:0;visibility:hidden;pointer-events:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.sync-screen.show{opacity:1;visibility:visible;pointer-events:none}
.sync-screen.show.error{pointer-events:auto}
.sync-panel{gap:10px}
.sync-title{font-size:clamp(28px,7vw,46px);font-weight:950;letter-spacing:-.04em;line-height:1.08}
.sync-subtitle{color:#a7b0bf;font-size:15px;line-height:1.4;margin-top:1px}
.sync-count{height:1.05em;margin-top:4px;font-size:clamp(86px,22vw,148px);font-weight:1000;line-height:.95;letter-spacing:-.06em}
.sync-status{min-height:28px;color:#c1c9d5;font-size:14px;font-weight:800}
.sync-progress{width:min(340px,76vw);height:7px;border-radius:999px;background:#202733;overflow:hidden;margin-top:2px}
.sync-progress i{display:block;height:100%;width:0%;background:#f5f7fb;border-radius:inherit;transition:width .08s linear}
.sync-retry{display:none;margin-top:5px;height:48px;min-width:180px;border:1px solid #394352;border-radius:14px;background:#151b24;color:#f2f4f8;font-weight:900}
.sync-screen.error .sync-retry{display:block}
.result-secondary-btn{width:min(300px,78vw);height:54px;border:1px solid #394352;border-radius:16px;background:#151b24;color:#eef1f6;font-size:15px;font-weight:900;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(max-width:620px){
  .result-panel{width:94vw}
  .result-stats{width:92vw}
  .round-results{width:92vw;max-height:33vh}
  .round-row{grid-template-columns:45px 1fr 46px;padding:5px 6px}
  .block-score{font-size:8px;padding:4px 0}
  .round-total{font-size:9px;min-width:46px}
}

</style>
<style>
#syncScreen, #syncScreen *{
  touch-action:none !important;
  -webkit-user-select:none !important;
  user-select:none !important;
}

  display:block;
}
.judge-flash .judge-sub{
  display:block;
  margin-top:12px;
  font-size:clamp(16px,4.2vw,28px);

  letter-spacing:.01em;
  line-height:1.2;
  color:rgba(255,255,255,.88);
  text-shadow:0 3px 16px rgba(0,0,0,.48);
}

</style>

.judge-flash,
.judge-flash .judge-main,
.judge-flash .judge-sub{
  text-align:center !important;
}
.judge-flash .judge-sub{
  width:100%;
